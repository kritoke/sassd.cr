name: Crystal CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    container:
      image: crystallang/crystal

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: shards install
    - name: Install system dependencies
      run: apt-get update && apt-get install -y curl wget
    - name: Install Node.js and npm
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install Just
      run: |
        # Install Just command runner
        JUST_VERSION="1.46.0"
        curl -Ls https://github.com/casey/just/releases/download/$JUST_VERSION/just-$JUST_VERSION-x86_64-unknown-linux-musl.tar.gz | tar xz
        mv just /usr/local/bin/just
    - name: Install Dart Sass
      run: just sass || npm install -g sass
    - name: Build CLI binary
      run: shards build
    - name: Run tests
      run: crystal spec
