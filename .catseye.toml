# Catseye project configuration for sassd.cr
# Suppresses false positive findings documented in planning/false-positives.md
# Updated: 2025-05-21

[taint.suppress]
# CommandInjection: Process.run uses array form (no shell), path validated by validate_bin_path!/validate_path!
CommandInjection = ["**/compiler.cr"]

# PathTraversal: paths validated by validate_and_resolve_path!/validate_path! + File.expand_path
PathTraversal = ["**/compiler.cr"]

[ai.suppress]
# Rules disabled in catseye core for Crystal (false positives):
# - unreachable-code, dead-code-after-error: Crystal guard clause idiom
# - sequential-blocking: Validation is inherently sequential
# - duplicate-validation: Defense-in-depth multi-layer validation
# - string-concat-loop: Array#<< is idiomatic Crystal
# - hallucinated-stdlib: puts/p/pp ARE valid Crystal methods (fixed in catseye core)

# Project-level suppressions for intentional patterns:
deprecated-syntax = ["**/*.cr"]  # puts/p/pp used intentionally for CLI output
debug-print = ["**/*.cr"]         # Some debug output is intentional

# Accepted findings per planning/false-positives.md:
primitive-obsession = ["**/*.cr"]  # Many String params are part of CLI/API design
long-method = ["**/*.cr"]          # Documented in planning/false-positives.md
too-many-params = ["**/*.cr"]      # Legacy API compatibility
flag-argument = ["**/*.cr"]        # Many boolean params are intentional design
ignored-return = ["**/*.cr"]       # Some return value discarding is intentional
feature-envy = ["**/*.cr"]         # Occasional cross-type access
redundant-self = ["**/*.cr"]       # Crystal style allows omitting self
nilable-ivar-access = ["**/*.cr"]  # Intentionally accessing potentially nil ivars
data-clump = ["**/*.cr"]           # Some parameter groups are intentional